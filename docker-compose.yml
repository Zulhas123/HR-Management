services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hrsystem-sql
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Your_strong_password123!"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: HrSystem.Web/Dockerfile
    container_name: hrsystem-web
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=HrSystemDb;User Id=sa;Password=Your_strong_password123!;TrustServerCertificate=True;Encrypt=False"
      Jwt__Issuer: "HrSystem"
      Jwt__Audience: "HrSystem"
      Jwt__Key: "CHANGE_ME__USE_A_LONG_RANDOM_SECRET_KEY"
      Admin__Username: "admin"
      Admin__Password: "admin123"
    ports:
      - "8080:8080"

